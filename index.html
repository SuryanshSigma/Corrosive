<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenlet</title>
    <style>
        /* General Body Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #000; /* Black background */
            margin: 0;
            padding: 0;
            color: #FFA500; /* Orange text */
        }

        /* Main Heading Styling */
        .comic-text {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 3em;
            font-weight: bold;
            color: #FFA500; /* Orange text */
            margin-top: 50px;
            text-shadow: 0 0 10px #FFA500, 0 0 20px #FF8C00; /* Glowing effect */
        }

        /* Subheading Styling */
        .subheading {
            font-family: Arial, sans-serif;
            font-size: 1.5em;
            color: #FFA500; /* Orange text */
            margin-top: 20px;
            text-shadow: 0 0 5px #FFA500; /* Subtle glow */
        }

        /* Link Button Styling */
        .link {
            font-family: "Comic Sans MS", cursive, sans-serif; /* Comic Sans MS font */
            font-size: 1.2em;
            font-weight: bold; /* Bold text */
            color: #000; /* Black text */
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            background-color: #FFA500; /* Orange background */
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease; /* Smooth animation */
            box-shadow: 0 0 10px #FFA500; /* Initial glow */
        }

        /* Hover Effect for Link Button */
        .link:hover {
            background-color: #FF8C00; /* Darker orange on hover */
            color: #000; /* Black text on hover */
            transform: scale(1.1); /* Slightly enlarge the button */
            box-shadow: 0 0 20px #FF8C00, 0 0 30px #FF4500; /* Stronger glow on hover */
        }

        /* Creator Credit Footer Styling */
        .footer-credit {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 1.1em;
            color: #FFA500;
            margin-top: 50px;
            text-shadow: 0 0 5px #FFA500;
        }
    </style>
</head>
<body>
    <div class="comic-text">Corrosive</div>
    <h2 class="subheading">Explore our sites!</h2>
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
        <a class="link" href="https://quizkeen.vercel.app" target="_blank">Visit Quizkeen (backup)</a>
        <a class="link" href="https://quizkeen.netlify.app" target="_blank">Visit Quizkeen</a>
    </div>
    <div>
        <a class="link" href="mailto:quizkeen12@gmail.com">Need Support? (response can take 2-3 day)</a>
    </div>
    <div class="footer-credit">
        Created by Suryansh Nimmagadda and Abdullah Shafi
    </div>
</body>
</html>
