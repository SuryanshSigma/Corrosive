<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrosive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #000; /* Black background */
            margin: 0;
            padding: 0;
            color: #FFA500; /* Orange text */
        }

        /* Admin Button on Top Left Corner */
        .admin-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            color: #000;
            text-decoration: none;
            background-color: #FFA500;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #FFA500;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .admin-btn:hover {
            background-color: #FF8C00;
            box-shadow: 0 0 20px #FF8C00, 0 0 30px #FF4500;
            transform: scale(1.1);
        }

        .top-right-buttons {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-right-buttons span {
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            color: #FFA500;
            text-shadow: 0 0 5px #FFA500;
        }

        .top-right-buttons a, .top-right-buttons button {
            font-family: Arial, sans-serif;
            font-size: 1em;
            font-weight: bold;
            color: #000;
            text-decoration: none;
            background-color: #FFA500;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease; /* Smooth animation */
            box-shadow: 0 0 10px #FFA500; /* Initial glow */
            border: none;
            cursor: pointer;
        }

        .top-right-buttons a:hover, .top-right-buttons button:hover {
            background-color: #FF8C00; /* Darker orange on hover */
            box-shadow: 0 0 20px #FF8C00, 0 0 30px #FF4500; /* Stronger glow on hover */
            transform: scale(1.1); /* Slightly enlarge the button */
        }

        .main-heading {
            font-family: "Comic Sans MS", cursive, sans-serif; /* Comic Sans MS font */
            font-size: 3em;
            font-weight: bold;
            color: #FFA500; /* Orange text */
            margin-top: 50px;
            text-shadow: 0 0 10px #FFA500, 0 0 20px #FF8C00; /* Glowing effect */
        }

        .subheading {
            font-family: Arial, sans-serif;
            font-size: 1.5em;
            color: #FFA500; /* Orange text */
            margin-top: 20px;
            text-shadow: 0 0 5px #FFA500; /* Subtle glow */
        }

        .link {
            font-family: "Comic Sans MS", cursive, sans-serif; /* Comic Sans MS font */
            font-size: 1.2em;
            font-weight: bold; /* Bold text */
            color: #000; /* Black text */
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            background-color: #FFA500; /* Orange background */
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease; /* Smooth animation */
            box-shadow: 0 0 10px #FFA500; /* Initial glow */
        }

        .link:hover {
            background-color: #FF8C00; /* Darker orange on hover */
            color: #000; /* Black text on hover */
            transform: scale(1.1); /* Slightly enlarge the button */
            box-shadow: 0 0 20px #FF8C00, 0 0 30px #FF4500; /* Stronger glow on hover */
        }

        /* Leaderboard Styling */
        .leaderboard-container {
            margin: 40px auto;
            max-width: 400px;
            background: #111;
            border: 2px solid #FFA500;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px #FFA500;
        }

        .leaderboard-container h3 {
            font-family: "Comic Sans MS", cursive, sans-serif;
            margin-top: 0;
            text-shadow: 0 0 5px #FFA500;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .leaderboard-list li {
            padding: 8px 12px;
            margin: 5px 0;
            background: #222;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            box-shadow: 0 0 5px #FFA500;
        }

        .footer-credit {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 1.1em;
            color: #FFA500;
            margin-top: 30px;
            text-shadow: 0 0 5px #FFA500;
        }
    </style>
</head>
<body>
    <!-- Top Left Admin Button -->
    <a href="admin.html" class="admin-btn" title="Open Admin Panel">⚙️</a>

    <!-- Top Right Buttons / User Status -->
    <div class="top-right-buttons" id="top-right-buttons">
        <!-- Dynamically populated -->
    </div>

    <h1 class="main-heading">Corrosive</h1>
    <h2 class="subheading">Explore our sites!</h2>
    
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
        <a class="link" href="https://quizkeen.vercel.app" target="_blank">Visit Quizkeen (backup)</a>
        <a class="link" href="https://quizkeen.netlify.app" target="_blank">Visit Quizkeen</a>
    </div>
    <div>
        <a class="link" href="mailto:quizkeen12@gmail.com">Need Support? (response can take 2-3 day)</a>
    </div>

    <!-- Leaderboard Section -->
    <div class="leaderboard-container">
        <h3>🏆 XP Leaderboard</h3>
        <ul class="leaderboard-list" id="leaderboard-list">
            <li>Loading leaderboard...</li>
        </ul>
    </div>

    <div class="footer-credit">
        Corrosive developed by Suryansh Nimmagadda
    </div>

    <script>
        // Localtunnel URL configuration for multi-device support
        const API_URL = 'https://corrosive.onrender.com';

        // Check sign-in state from localStorage
        const isSignedIn = localStorage.getItem('isSignedIn') === 'true';
        const userEmail = localStorage.getItem('userEmail');
        const topRightButtons = document.getElementById('top-right-buttons');

        if (isSignedIn && userEmail) {
            topRightButtons.innerHTML = `
                <span>👤 ${userEmail}</span>
                <button onclick="logOut()">Log Out</button>
            `;
        } else {
            topRightButtons.innerHTML = `
                <a href="signin.html">Sign In</a>
            `;
        }

        // Log out function
        function logOut() {
            localStorage.removeItem('isSignedIn');
            localStorage.removeItem('userEmail');
            window.location.reload();
        }

        // Fetch and render the XP leaderboard from the server including badges
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}/leaderboard`, {
                    headers: {
                        'Bypass-Tunnel-Reminder': 'true'
                    }
                });
                const leaderboard = await response.json();
                
                const listElement = document.getElementById('leaderboard-list');
                listElement.innerHTML = '';

                if (leaderboard.length === 0) {
                    listElement.innerHTML = '<li>No users found yet.</li>';
                    return;
                }

                leaderboard.forEach((user, index) => {
                    const li = document.createElement('li');
                    
                    let badge = '';
                    if (user.role === 'owner') badge = ' 👑';
                    else if (user.role === 'admin') badge = ' 🛡️';
                    else if (user.role === 'partner') badge = ' ✔️';

                    li.innerHTML = `<span>#${index + 1} ${user.email}${badge}</span> <strong>${user.xp} XP</strong>`;
                    listElement.appendChild(li);
                });
            } catch (error) {
                console.error('Failed to load leaderboard', error);
                document.getElementById('leaderboard-list').innerHTML = '<li>Error loading leaderboard</li>';
            }
        }

        loadLeaderboard();
    </script>
</body>
</html>
